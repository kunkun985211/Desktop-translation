name: Ubuntu X11 tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['20.04', '22.04', '24.04']
    container:
      image: ubuntu:${{ matrix.ubuntu }}
    env:
      DEBIAN_FRONTEND: noninteractive
      XDG_SESSION_TYPE: x11
    steps:
      - name: Install system and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-venv python3-gi python3-gi-cairo \
            python3-requests gir1.2-gtk-3.0 gir1.2-secret-1 \
            gir1.2-ayatanaappindicator3-0.1 gnome-keyring \
            xvfb xauth dbus-x11 fonts-noto-cjk
      - uses: actions/checkout@v4
      - name: Create environment without desktop installation
        run: ./setup.sh --skip-system-packages --no-desktop
      - name: Offline regression tests on a virtual X11 display
        run: |
          xvfb-run -a -s '-screen 0 3840x2160x24' \
            dbus-run-session -- .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
